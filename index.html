<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PewPew Games</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header id="top-bar" class="top-bar">
      <button id="btn-home" class="pill-btn" title="Game Hub">◀ Games</button>
      <div class="room-pill">
        <span id="conn-dot" class="dot offline"></span>
        <span id="room-label">ROOM ----</span>
      </div>
      <div class="role-controls">
        <button id="btn-role-switch" class="pill-btn" title="Switch Player Role">P1: Her</button>
        <button id="btn-sound" class="pill-btn" title="Toggle Sound">🔊</button>
      </div>
    </header>

    <main id="stage" class="stage">
      <!-- Views rendered dynamically by modular JS modules -->
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
